:root{--bg:#f6f3ee;--card:#fff;--ink:#23201c;--mut:#7a7368;--line:#e3ddd2;--acc:#c8553d;--acc2:#a8412c;--r:12px}
@media(prefers-color-scheme:dark){:root{--bg:#1c1a17;--card:#27241f;--ink:#f1ece4;--mut:#a39a8c;--line:#3a352e;--acc:#e0725a;--acc2:#f08a72}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;font-weight:650}
.lang button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer}
main{display:grid;grid-template-columns:1fr;gap:0}
.view{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 16px 0}
#gl{width:100%;height:38vh;min-height:230px;display:block;border-radius:var(--r);background:radial-gradient(circle at 50% 35%,#fff,#e8e2d6);touch-action:none;cursor:grab}
@media(prefers-color-scheme:dark){#gl{background:radial-gradient(circle at 50% 35%,#3a352d,#1f1c18)}}
#status{font-size:12px;color:var(--mut);padding:6px 2px;min-height:26px}
#status b{color:var(--acc)}
.panel{padding:8px 16px 120px;display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
.card h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0;font-weight:650}
label{display:grid;gap:4px;font-size:13px;color:var(--mut)}
label .row{display:flex;justify-content:space-between}
label output{color:var(--ink);font-variant-numeric:tabular-nums}
input[type=text],select{width:100%;padding:10px 12px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px}
input[type=range]{width:100%;accent-color:var(--acc)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;padding:9px 10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;font:inherit;cursor:pointer}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.colors input{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px}
.chk{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
.bar button{flex:1;padding:13px 10px;border-radius:10px;border:1px solid var(--acc);font:inherit;font-weight:600;cursor:pointer;background:var(--acc);color:#fff}
.bar button.sec{background:none;color:var(--acc)}
.bar button:disabled{opacity:.5}
#gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;place-items:center;padding:20px}
#gate div{max-width:380px;display:grid;gap:12px}
#gate button{padding:12px;border-radius:10px;border:0;background:var(--acc);color:#fff;font:inherit;font-weight:600}
#gmsg{color:var(--acc);min-height:1.2em;font-size:13px}
@media(min-width:900px){
 main{grid-template-columns:minmax(0,1.25fr) minmax(340px,.75fr);height:calc(100vh - 53px)}
 .view{position:static;padding:12px 8px 12px 16px;display:flex;flex-direction:column}
 #gl{height:auto;flex:1}
 .panel{overflow:auto;padding-bottom:90px}
}

:root{--bg:#f5f3ef;--card:#fffdf9;--line:#e4e0d7;--acc:#657a64;--acc2:#4f6350;--mut:#74776e}
@media(prefers-color-scheme:dark){:root{--bg:#1d1f1b;--card:#272a24;--line:#383c33;--acc:#86a084;--acc2:#a3bba1;--mut:#a2a79a}}
header{background:var(--card)}
.brand{display:flex;gap:11px;align-items:center}.mark{width:36px;height:36px;border-radius:11px;background:var(--acc);display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px}
header h1 span{font-weight:400;color:var(--mut)}header p{margin:1px 0 0;color:var(--mut);font-size:12px}
.stage{position:relative;height:38vh;min-height:240px}.stage #gl{height:100%;min-height:0}
.vt{position:absolute;right:10px;top:10px;display:flex;gap:6px}.vt button{padding:6px 10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font:inherit;font-size:12px;cursor:pointer}.vt button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:2px 0 8px}.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}.stat span{display:block;font-size:11px;color:var(--mut)}.stat strong{font-size:16px;font-variant-numeric:tabular-nums}
.card p{margin:0;font-size:13px;color:var(--mut)}.btn{padding:11px;border-radius:10px;border:1px solid var(--acc);background:none;color:var(--acc);font:inherit;font-weight:600;cursor:pointer}
.panel[data-mode=single] .addrow,.panel[data-mode=single] .mg,.panel[data-mode=single] .mh button,.panel[data-mode=single] .pfill{display:none}.panel[data-mode=plan] .tsel{display:none}
.mrow{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px}.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.mh button{border:0;background:none;color:var(--mut);cursor:pointer;font-size:16px}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.mo{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:end;margin-top:6px}.mo>*{flex:1 1 70px;min-width:0}.mrow label{font-size:11px;color:var(--mut)}.mrow input[type=number],.mrow select{width:100%;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.addrow .btn{flex:1;padding:8px}#plmsgs{margin:0;padding-left:18px;font-size:13px}#plmsgs li.e{color:#b3402a;font-weight:600}#plmsgs li.i{color:var(--mut)}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
@media(min-width:900px){.stage{height:auto;flex:1;min-height:320px}}
.panel{padding-bottom:24px}#cartlist{display:grid;gap:8px}#cartlist:empty{display:none}.crow{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}.cno{flex:none;width:26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}.cmain{flex:1;min-width:0;display:grid;gap:2px}.cmain input[type=text]{padding:4px 6px;border:1px solid transparent;background:none;font-weight:600}.cmain input[type=text]:focus{border-color:var(--line);background:var(--card)}.cmain small{color:var(--mut);font-size:12px;padding-left:6px}.cic{flex:none;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;cursor:pointer}.btn.pri{background:var(--acc);color:#fff;padding:13px}.btn:disabled{opacity:.5;cursor:default}#creditinfo{font-size:13px;margin:0;padding:8px 10px;border-radius:9px;background:var(--bg);color:var(--ink)!important}.gx{margin-left:8px;background:none!important;color:inherit!important;border:1px solid currentColor!important;width:auto}

:root{--bg:#f6f0e4;--card:#fdfaf2;--ink:#1e1a17;--mut:#6f6458;--line:#e2d6c4;--acc:#1e1a17;--acc2:#3a322b;--on:#fdfaf2;--warm:#c46546;--r:18px}
@media(prefers-color-scheme:dark){:root{--bg:#151412;--card:#1f1d1a;--ink:#f2ede3;--mut:#a59d8f;--line:#38332c;--acc:#f2ede3;--acc2:#d9d2c4;--on:#151412;--warm:#d98462}}
html,body{background:var(--bg);color:var(--ink)}
header{background:var(--card);border-bottom:3px solid var(--ink);box-shadow:0 3px 0 var(--card),0 5px 0 var(--warm);margin-bottom:5px;padding:8px 16px}
.brand{gap:12px}.logo{width:56px;height:56px;flex:none;display:block;border-radius:50%;box-shadow:0 1px 3px rgba(30,26,23,.18)}
header h1{font-family:Script,cursive;font-size:29px;font-weight:700;line-height:1.05;letter-spacing:.01em}
header p{font-size:12px;color:var(--mut);margin-top:2px}
.lang button{border-radius:999px;border-color:var(--ink);padding:5px 12px;font-weight:600}
.card{border-radius:var(--r);box-shadow:0 1px 2px rgba(30,28,25,.05)}
.card h2{font-family:Script,cursive;font-size:23px;line-height:1.1;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:700}
.card p{color:var(--mut)}
#gl{border-radius:var(--r);border:1px solid var(--line);background:radial-gradient(circle at 50% 30%,#fffdf8,#ece2d0)}

.vt button{border-radius:999px;border-color:var(--line);background:var(--card)}.vt button.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
.seg button{border-radius:999px;background:var(--card)}.seg button.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
.btn{border-radius:999px;border-color:var(--ink);color:var(--ink)}.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on)}
input[type=text],select,.mrow input[type=number],.mrow select{border-radius:12px}input[type=range],input[type=checkbox]{accent-color:var(--warm)}
.stat{border-radius:14px}.mrow{border-radius:14px;background:var(--bg)}
#status b{color:var(--warm)}

.mo>.chk,.mo>label:last-child{flex:1 1 100%}.colors label:has(input[type=checkbox]){display:flex;align-items:center;gap:8px;color:var(--ink)}.colors input[type=checkbox]{width:20px;height:20px;flex:none;margin:0}
@media(min-width:900px){main{height:calc(100vh - 83px)}}
#adminbtn{display:inline-grid;place-items:center;border-radius:999px;background:var(--warm);color:#fff;text-decoration:none;font-weight:700;font-size:12px;padding:3px 10px}#adminbtn[hidden]{display:none}
#homebtn{display:inline-grid;place-items:center;min-width:34px;border:1px solid var(--ink);border-radius:999px;color:var(--ink);text-decoration:none;font-weight:700;padding:3px 10px}#homebtn[hidden]{display:none}
.lang{display:flex;gap:6px}.lang button{min-width:34px}#helpbtn{font-weight:700}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ib{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--warm);background:none;color:var(--warm);font:italic 700 14px/1 Georgia,serif;cursor:pointer;padding:0}
.ib.on{background:var(--warm);color:#fff}
.card p.info{background:var(--bg);border-left:3px solid var(--warm);border-radius:0 10px 10px 0;padding:9px 12px;color:var(--ink);font-size:13px;line-height:1.45}
.vhint{position:absolute;left:10px;bottom:10px;right:10px;width:max-content;max-width:calc(100% - 20px);font-size:11px;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;pointer-events:none;transition:opacity .6s}
.vhint.gone{opacity:0}
#help{position:fixed;inset:0;z-index:40;background:rgba(30,26,23,.45);display:none;place-items:center;padding:16px;overflow:auto}
.hbox{background:var(--card);border-radius:22px;max-width:440px;width:100%;padding:22px 20px;display:grid;gap:10px;justify-items:center;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.hlogo{width:96px;height:96px}.hbox h2{font-family:Script,cursive;font-size:32px;margin:0}
.hbox ol{margin:0;padding-left:22px;display:grid;gap:8px;font-size:14px;line-height:1.45;justify-self:stretch}.hbox ol li::marker{color:var(--warm);font-weight:700}
.hbox p{margin:0;font-size:13px;color:var(--mut);text-align:center}
#helpgo{width:100%;padding:13px;border-radius:999px;border:0;background:var(--acc);color:var(--on);font:inherit;font-weight:600;cursor:pointer}
.seg.shp button{flex:0 1 auto;font-size:13px;padding:7px 11px;position:relative}.seg.shp button.on::after{content:attr(data-n);position:absolute;top:-6px;right:-4px;background:var(--warm);color:#fff;border-radius:999px;font-size:10px;min-width:16px;height:16px;line-height:16px;text-align:center}
.legal{padding:4px 4px 8px;text-align:center}.legal p{margin:0;font-size:11px;line-height:1.4;color:var(--mut)}.legal a{color:var(--warm);font-size:13px;font-weight:600}

const PZ_FONT='KFModern',PZ_MARGIN=12,PZ_WALL=5,PZ_KNOB_H=7;

const pzHash=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)>>>0}return h%100000000};
const pzCircle=(cx,cy,r,n=40)=>[Array.from({length:n},(_,i)=>[cx+r*Math.cos(i/n*2*Math.PI),cy+r*Math.sin(i/n*2*Math.PI)])];
// Ringe aus einer Zeichnung; winzige Artefakt-Ringe (Kantenrauschen, < 0.5 mm²) werden verworfen
const pzRings=(wm,hm,res,tol,draw)=>{const k=mk(wm,hm,res);k.x.scale(1,-1);draw(k.x,k);return marching(fieldOf(k),k.c.width,k.c.height,res).map(q=>simplify(q,tol)).filter(r=>r.length>=3&&Math.abs(area(r))>=.5)};
// Pfad aus Ringen (Weltkoordinaten) – fuer Vertiefungen im Brett
const pzPath=(x,R,dx,dy)=>{x.beginPath();for(const r of R){r.forEach((p,i)=>i?x.lineTo(p[0]+dx,p[1]+dy):x.moveTo(p[0]+dx,p[1]+dy));x.closePath()}};
// Abgetrennte Teile (Ä/Ö/Ü-Punkte) mit dem groessten Teil verbinden: keine losen Kleinteile
function pzJoin(k){const{c,x}=k,w=c.width,h=c.height,d=x.getImageData(0,0,w,h).data,lab=new Int32Array(w*h).fill(-1),comps=[];
 for(let i=0;i<w*h;i++){if(d[i*4+3]<128||lab[i]>=0)continue;const st=[i],px=[];lab[i]=comps.length;
  while(st.length){const q=st.pop();px.push(q);const qx=q%w,qy=(q/w)|0;for(const[nx,ny]of[[qx+1,qy],[qx-1,qy],[qx,qy+1],[qx,qy-1]]){if(nx<0||ny<0||nx>=w||ny>=h)continue;const n=ny*w+nx;if(lab[n]<0&&d[n*4+3]>=128){lab[n]=comps.length;st.push(n)}}}
  comps.push(px)}
 if(comps.length<2)return;comps.sort((a,b)=>b.length-a.length);const main=comps[0],step=Math.max(1,(main.length/1500)|0);
 x.save();x.setTransform(1,0,0,1,0,0);x.lineCap='round';
 for(const cp of comps.slice(1)){let best=1e18,A=0,B=0;const st2=Math.max(1,(cp.length/300)|0);
  for(let a=0;a<cp.length;a+=st2)for(let b=0;b<main.length;b+=step){const p=cp[a],q=main[b],dd=(p%w-q%w)**2+(((p/w)|0)-((q/w)|0))**2;if(dd<best){best=dd;A=p;B=q}}
  let mnx=1e9,mxx=-1e9;for(const p of cp){mnx=Math.min(mnx,p%w);mxx=Math.max(mxx,p%w)}
  let sx=0,sy=0;for(const p of cp){sx+=p%w;sy+=(p/w)|0}sx/=cp.length;sy/=cp.length;
  x.lineWidth=Math.max(2,(mxx-mnx)*.55);x.beginPath();x.moveTo(sx,sy);x.lineTo(B%w,(B/w)|0);x.stroke()}
 x.restore()}
// Ein Buchstabe als Ringe (mm), x zentriert, Grossbuchstaben-Mitte bei y=0
function pzLetter(ch,fs,capH,res,tol){
 const m=document.createElement('canvas').getContext('2d');m.font=fs+'px '+PZ_FONT;const t=m.measureText(ch);
 const wl=t.actualBoundingBoxLeft,wr=t.actualBoundingBoxRight,W=wl+wr,Hm=fs*1.6;
 const R=pzRings(W+8,Hm,res,tol,(x,k)=>{x.save();x.scale(1,-1);x.font=fs+'px '+PZ_FONT;x.textBaseline='alphabetic';x.fillText(ch,(wl-wr)/2,capH/2);x.restore();pzJoin(k)});
 let y0=1e9,y1=-1e9;for(const r of R)for(const p of r){y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1])}
 return{ch,R,w:W,y0,y1}}
// Punkt am weitesten vom Rand (fuer den Greifknopf)
function pzDeep(R){const pin=p=>R.reduce((n,r)=>n+(pip(p,r)?1:0),0)%2===1;let bx=1e9,by=1e9,Bx=-1e9,By=-1e9;
 for(const r of R)for(const p of r){bx=Math.min(bx,p[0]);by=Math.min(by,p[1]);Bx=Math.max(Bx,p[0]);By=Math.max(By,p[1])}
 let best=[0,0],bd=0;for(let x=bx;x<=Bx;x+=.8)for(let y=by;y<=By;y+=.8){const p=[x,y];if(!pin(p))continue;let d=1e9;
  for(const r of R)for(let i=0,n=r.length;i<n;i++){const a=r[i],b=r[(i+1)%n],vx=b[0]-a[0],vy=b[1]-a[1],l=vx*vx+vy*vy||1,u=Math.max(0,Math.min(1,((x-a[0])*vx+(y-a[1])*vy)/l));d=Math.min(d,Math.hypot(x-a[0]-u*vx,y-a[1]-u*vy))}
  if(d>bd){bd=d;best=p}}
 return{p:best,d:bd}}

// Figur als Ringe (mm), Begrenzung zentriert
function pzShape(id,H,res,tol){
 let R=pzRings(H*1.4,H*1.4,res,tol,(x,k)=>{x.save();x.scale(H,H);x.lineJoin='round';
  const d={C:(a,b,r)=>{x.beginPath();x.arc(a,b,r,0,6.2832);x.fill()},E:(a,b,rx,ry)=>{x.beginPath();x.ellipse(a,b,rx,ry,0,0,6.2832);x.fill()},
   R:(a,b,w,h,r)=>{x.beginPath();x.roundRect(a,b,w,h,r||0);x.fill()},P:(pts,rd)=>{x.beginPath();pts.forEach((q,n)=>n?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]));x.closePath();x.fill();if(rd){x.lineWidth=rd;x.stroke()}}};
  PZ_SHAPES[id](d);x.restore();pzJoin(k)});
 let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const r of R)for(const p of r){x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1])}
 const mx=(x0+x1)/2,my=(y0+y1)/2;R=R.map(r=>r.map(p=>[p[0]-mx,p[1]-my]));
 return{ch:id,R,w:x1-x0,y0:y0-my,y1:y1-my}}
// Reihe nebeneinander legen und zentrieren; Rueckgabe Breite
function pzRow(items,gap){let x=0;for(const g of items){g.cx=x+g.w/2;x+=g.w+gap}const W=Math.max(0,x-gap);items.forEach(g=>g.cx-=W/2);return W}

async function buildPuzzle(res,tol,opt={}){
 try{await document.fonts.load('100px '+PZ_FONT)}catch(e){}
 const name=opt.name??pzName(S.name),sub=opt.sub??String(S.sub||'').slice(0,40).trim(),shapes=(opt.shapes??S.shapes).filter(id=>PZ_SHAPES[id]).slice(0,6);
 if(!name.replace(/ /g,'')&&!shapes.length)return{ok:false,err:tr('eName'),parts:[],units:[],info:{}};
 const clr=pzClr(),T=+S.T||12,Pd=Math.round(T*.5),LT=Pd+3,GAP=2*clr+PZ_WALL;
 const m=document.createElement('canvas').getContext('2d');m.font='100px '+PZ_FONT;const capR=m.measureText('H').actualBoundingBoxAscent/100;
 const maxW=250-2*PZ_MARGIN;
 // Reihe 1: Buchstaben. Groesse so waehlen, dass das Brett aufs Druckbett passt; mind. 30 mm (Kleinteile)
 let H=+S.H||50,scaled=false,letters=[],RW=0;
 if(name.replace(/ /g,'')){
  const rowW=H=>[...name].reduce((s,ch)=>s+(ch===' '?.4*H:m.measureText(ch).width*H/capR/100),0)+(name.length-1)*GAP;
  if(rowW(H)>maxW){H=Math.floor(H*maxW/rowW(H));scaled=true}
  for(let pass=0;pass<4;pass++){
   if(H<30)return{ok:false,err:tr('eLong'),parts:[],units:[],info:{}};
   const fs=H/capR;letters=[];let x=0;
   for(const ch of name){if(ch===' '){x+=.4*H+GAP;continue}
    const g=pzLetter(ch,fs,H,res,tol);letters.push({...g,cx:x+g.w/2});x+=g.w+GAP}
   RW=x-GAP;if(RW<=maxW)break;H=Math.floor(H*maxW/RW-1);scaled=true}
  letters.forEach(g=>g.cx-=RW/2)}
 // Reihe 2: Figuren (gleiche Groesse, falls noetig kleiner)
 let figs=[],FW=0,Hs=+S.H||50;
 for(let pass=0;shapes.length&&pass<4;pass++){
  if(Hs<30)return{ok:false,err:tr('eShapes'),parts:[],units:[],info:{}};
  figs=shapes.map(id=>pzShape(id,Hs,res,tol));FW=pzRow(figs,GAP);if(FW<=maxW)break;Hs=Math.floor(Hs*maxW/FW-1)}
 // Reihen uebereinander, darunter optional die gravierte Zeile
 const rows=[letters,figs].filter(r=>r.length),ext=r=>[Math.min(...r.map(g=>g.y0))-clr,Math.max(...r.map(g=>g.y1))+clr],RGAP=PZ_WALL+5;
 const SUBH=sub?Math.min(9,(letters.length?H:Hs)*.22):0,contentH=rows.reduce((t,r)=>{const e=ext(r);return t+e[1]-e[0]},0)+RGAP*(rows.length-1);
 const Wb=Math.max(RW,FW,(letters.length?H:Hs))+2*PZ_MARGIN,Db=contentH+2*PZ_MARGIN+(sub?SUBH+6:0);
 let yt=Db/2-PZ_MARGIN;for(const r of rows){const e=ext(r),oy=yt-e[1];r.forEach(g=>g.oy=oy);yt-=(e[1]-e[0])+RGAP}
 const pieces=letters.concat(figs);
 // Brett: Umriss, Vertiefungen (Teil + Spiel), Gravur
 const bw=Wb+4,bh=Db+4,ring=draw=>pzRings(bw,bh,res,tol,draw);
 const A=ring(xx=>{xx.beginPath();xx.roundRect(-Wb/2,-Db/2,Wb,Db,Math.min(10,Db/4));xx.fill()});
 const P=ring(xx=>{xx.lineJoin='round';xx.lineWidth=2*clr;for(const g of pieces){pzPath(xx,g.R,g.cx,g.oy);xx.fill('evenodd');xx.stroke()}});
 const E=sub?ring(xx=>{xx.save();xx.scale(1,-1);xx.font=(SUBH/capR)+'px '+PZ_FONT;xx.textAlign='center';xx.textBaseline='alphabetic';
  const w=xx.measureText(sub).width;if(w>Wb-2*PZ_MARGIN)xx.font=(SUBH/capR*(Wb-2*PZ_MARGIN)/w)+'px '+PZ_FONT;xx.fillText(sub,0,Db/2-PZ_MARGIN*.6);xx.restore()}):[];
 const bt=[];cap(A,0,false,bt);walls(A,0,T,bt);cap(A.concat(rev(P),rev(E)),T,true,bt);walls(rev(P),T-Pd,T,bt);cap(P,T-Pd,true,bt);
 if(E.length){walls(rev(E),T-1,T,bt);cap(E,T-1,true,bt)}
 const parts=[{key:'cBoard',name:'Brett',tris:Float32Array.from(bt),asm:[(X,Y,Z)=>[X,Y,Z]]}];
 pieces.forEach((g,i)=>{const t=extrude(g.R,0,LT);
  if(S.knob){const k=pzDeep(g.R),r=Math.min(5,k.d-1.2);if(r>=2.5)t.push(...extrude(pzCircle(k.p[0],k.p[1],r),LT,LT+PZ_KNOB_H))}
  parts.push({key:'cL'+(i%6),name:(PZ_SHAPES[g.ch]?'Figur '+(i+1)+' '+g.ch:'Buchstabe '+(i+1)+' '+g.ch),tris:Float32Array.from(t),asm:[(X,Y,Z)=>[X+g.cx,Y+g.oy,Z+T-Pd+.05]]})});
 return{ok:true,err:'',parts,units:[[Math.round(Wb),Math.round(Db),pzHash(name+'|'+shapes.join(','))]],info:{name:name+(shapes.length?(name?' + ':'')+shapes.map(id=>tr('sh_'+id)).join(', '):''),Wb,Db,T,H,scaled,n:pieces.length,cut:[...String(S.name||'').trim()].length>12}}}

   S (Zustand, mit view/hide/mode), PRODUCT {id,name,file,store,unit,build,snap,applySnap,snapName,snapCount,snapInfo,units,color?,onChange?},
   ui() (Karten bauen, cartCard() einfuegen), present(reframe) (Vorschau/Statistik/Meldungen), arrange(parts,mode) ('print' -> arrangePrint). */
function bbox(t){const a=[1e9,1e9,1e9],b=[-1e9,-1e9,-1e9];for(let i=0;i<t.length;i+=3)for(let k=0;k<3;k++){a[k]=Math.min(a[k],t[i+k]);b[k]=Math.max(b[k],t[i+k])}return{a,b}}
function xf(t,fn){const o=new Float32Array(t.length);for(let i=0;i<t.length;i+=3){const p=fn(t[i],t[i+1],t[i+2]);o[i]=p[0];o[i+1]=p[1];o[i+2]=p[2]}return o}
/* Teile nebeneinander auf Druckplatten-Breite legen (Druckanordnung, 3MF) */
function arrangePrint(parts){const gap=10,maxW=246;let cx=0,cy=0,rowH=0;const out=[];
 for(const p of parts.map(p=>p.pf?{...p,tris:xf(p.tris,p.pf)}:p).flatMap(p=>p.qty>1?Array.from({length:p.qty},(_,i)=>({...p,name:p.name+' '+(i+1)})):[p])){const{a,b}=bbox(p.tris),w=b[0]-a[0],d=b[1]-a[1];if(cx>0&&cx+w>maxW){cx=0;cy+=rowH+gap;rowH=0}
  out.push({...p,tris:xf(p.tris,(x,y,z)=>[x-a[0]+cx,y-a[1]+cy,z])});cx+=w+gap;rowH=Math.max(rowH,d)}
 let mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9;out.forEach(p=>{const{a,b}=bbox(p.tris);mnx=Math.min(mnx,a[0]);mny=Math.min(mny,a[1]);mxx=Math.max(mxx,b[0]);mxy=Math.max(mxy,b[1])});
 const ox=(mnx+mxx)/2,oy=(mny+mxy)/2;out.forEach(p=>p.tris=xf(p.tris,(x,y,z)=>[x-ox,y-oy,z]));out.span=[mxx-mnx,mxy-mny];return out}
/* Volumen eines Dreiecksnetzes (mm^3) */
const volume=t=>{let v=0;for(let i=0;i<t.length;i+=9)v+=t[i]*(t[i+4]*t[i+8]-t[i+5]*t[i+7])-t[i+1]*(t[i+3]*t[i+8]-t[i+5]*t[i+6])+t[i+2]*(t[i+3]*t[i+7]-t[i+4]*t[i+6]);return v/6};
function frame(parts){let a=[1e9,1e9,1e9],b=[-1e9,-1e9,-1e9];parts.forEach(p=>{const q=bbox(p.tris);for(let k=0;k<3;k++){a[k]=Math.min(a[k],q.a[k]);b[k]=Math.max(b[k],q.b[k])}});
 const s=[b[0]-a[0],b[1]-a[1],b[2]-a[2]];cam.tx=(a[0]+b[0])/2;cam.ty=(a[1]+b[1])/2;cam.tz=(a[2]+b[2])/2;cam.el=.85;cam.dist=Math.max(s[0]*2.2,s[1]*2.6,s[2]*3.4,140)}
fit=()=>{if(built)frame(arrange(built.parts,S.view))};

 opts.forEach(o=>{const op=document.createElement('option');op.value=o[0];op.dataset.k=o[1];e.append(op)});e.value=(c._t||S)[key];e.onchange=()=>{(c._t||S)[key]=e.value;changed()};l.append(s,e);c.append(l)}

 const bs=opts.map(o=>{const b=document.createElement('button');b.dataset.k=o[1];b.onclick=()=>{(c._t||S)[key]=o[0];bs.forEach((x,i)=>x.classList.toggle('on',opts[i][0]===(c._t||S)[key]));changed()};d.append(b);return b});
 bs.forEach((x,i)=>x.classList.toggle('on',opts[i][0]===(c._t||S)[key]));l.append(s,d);c.append(l)}

 const i=document.createElement('input');i.type='range';i.min=mn;i.max=mx;i.step=st;i.value=(c._t||S)[key];const sh=()=>o.textContent=(+i.value).toString().replace('.',',')+' '+unit;sh();

function clean(t){const o=[];for(let i=0;i<t.length;i+=9){const ux=t[i+3]-t[i],uy=t[i+4]-t[i+1],uz=t[i+5]-t[i+2],vx=t[i+6]-t[i],vy=t[i+7]-t[i+1],vz=t[i+8]-t[i+2];
 if(Math.hypot(uy*vz-uz*vy,uz*vx-ux*vz,ux*vy-uy*vx)>1e-6)for(let k=0;k<9;k++)o.push(t[i+k])}return Float32Array.from(o)}
async function refresh(){const my=++seq;const r=await PRODUCT.build(5,.05);if(my!==seq)return;r.mode=S.mode;const first=!built||built.mode!==S.mode;built=r;present(first)}
function threeMF(parts){const hex=h=>h.replace('#','').toUpperCase(),f=v=>v.toFixed(4);let objs='',mats='',items='';
 parts.forEach((p,i)=>{const{V,I}=weld(p.tris),id=i+2;mats+=`<base name="${p.name}" displaycolor="#${hex(p.color)}"/>`;
  let vs='',ts='';for(let k=0;k<V.length;k+=3)vs+=`<vertex x="${f(V[k])}" y="${f(V[k+1])}" z="${f(V[k+2])}"/>`;for(let k=0;k<I.length;k+=3)ts+=`<triangle v1="${I[k]}" v2="${I[k+1]}" v3="${I[k+2]}"/>`;
  objs+=`<object id="${id}" name="${p.name}" type="model" pid="1" pindex="${i}"><mesh><vertices>${vs}</vertices><triangles>${ts}</triangles></mesh></object>`;
  items+=`<item objectid="${id}" transform="1 0 0 0 1 0 0 0 1 128 128 0" printable="1"/>`});
 const model=`<?xml version="1.0" encoding="UTF-8"?><model unit="millimeter" xml:lang="en-US" xmlns="http://schemas.microsoft.com/3dmanufacturing/core/2015/02"><metadata name="Title">${PRODUCT.name}</metadata><metadata name="Application">ModuNest Studio</metadata><resources><basematerials id="1">${mats}</basematerials>${objs}</resources><build>${items}</build></model>`;
 const ct=`<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="model" ContentType="application/vnd.ms-package.3dmanufacturing-3dmodel+xml"/></Types>`;
 const rels=`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Target="/3D/3dmodel.model" Id="rel0" Type="http://schemas.microsoft.com/3dmanufacturing/2013/01/3dmodel"/></Relationships>`;
 const e=new TextEncoder();return zip([{name:'[Content_Types].xml',data:e.encode(ct)},{name:'_rels/.rels',data:e.encode(rels)},{name:'3D/3dmodel.model',data:e.encode(model)}])}

const gEl=id=>document.getElementById(id);
let SES=null;try{SES=JSON.parse(localStorage.getItem('mn-ses')||'null')}catch(e){}
const saveSes=()=>{try{SES?localStorage.setItem('mn-ses',JSON.stringify(SES)):localStorage.removeItem('mn-ses')}catch(e){}};
const apiCall=async(p,b)=>{try{const r=await fetch(CONFIG.api.replace(/\/$/,'')+'/'+p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});return{ok:r.ok,j:await r.json().catch(()=>({}))}}catch(e){return{ok:false,j:{error:'net'}}}};
function creditInfo(){const e=gEl('creditinfo');if(!e)return;e.textContent=!CONFIG.requireCode?tr('demoMode'):(SES&&SES.exp>Date.now()?trf('creditLeft',SES.left):tr('notUnlocked'))}
function gate(msg){gEl('gate').style.display='grid';gEl('gmsg').textContent=msg||''}
async function redeem(code){const r=await apiCall('redeem',{code});if(!r.ok)return tr(r.j.error==='rate'?'gateRate':r.j.error==='net'?'gateNet':r.j.error==='pending'?'gatePending':'gateBad');SES={token:r.j.token,left:r.j.left,exp:r.j.exp};saveSes();creditInfo();return''}
function unlockedNow(){if(!CONFIG.requireCode)return true;if(!CONFIG.api){gate(tr('gateCfg'));return false}if(!SES||SES.exp<Date.now()){gate();return false}return true}
/* Abrechnung pro Kiste (Modul). cfgs = je Konfiguration die Kistenmasse [lang,kurz,hoch]; der Server bucht nur ab,
   was nicht innerhalb 24 h schon bezahlt wurde (gleiche Kistenzahl, je Mass max. 5 mm Abweichung). */
async function charge(cfgs){if(!CONFIG.requireCode)return{n:0,free:0};const r=await apiCall('consume',{token:SES.token,cfgs,product:PRODUCT.id});
 if(r.ok){SES.left=r.j.left;saveSes();creditInfo();return{n:r.j.n||0,free:(r.j.free||[]).length}}
 if(r.j.error==='credits'){SES.left=r.j.left||0;saveSes();creditInfo();gate(tr('gateEmpty'))}else if(r.j.error==='net')gate(tr('gateNet'));else{SES=null;saveSes();creditInfo();gate(tr('gateBad'))}return null}

function renderCart(){const e=gEl('cartlist'),x=gEl('cartexp');if(!e)return;e.innerHTML='';
 CART.forEach((it,i)=>{const r=document.createElement('div');r.className='crow';
  const no=document.createElement('span');no.className='cno';no.textContent=i+1;
  const m=document.createElement('div');m.className='cmain';const n=document.createElement('input');n.type='text';n.size=1;n.value=it.name;n.setAttribute('aria-label',tr('cartName'));n.onchange=()=>{it.name=n.value.replace(/[^\w\- ]+/g,'').trim()||'Konfig';n.value=it.name;saveCart()};
  const d=document.createElement('small');d.textContent=PRODUCT.snapInfo(it);m.append(n,d);
  const l=document.createElement('button');l.className='cic';l.textContent='↺';l.title=l.ariaLabel=tr('cartLoad');l.onclick=()=>{PRODUCT.applySnap(it);buildUI();changed()};
  const del=document.createElement('button');del.className='cic';del.textContent='✕';del.title=del.ariaLabel=tr('cartDel');del.onclick=()=>{CART.splice(i,1);saveCart();renderCart()};
  r.append(no,m,l,del);e.append(r)});
 const ok=!built||built.ok;
 if(x){x.textContent=CART.length?trf('cartExpN',CART.reduce((a,c)=>a+PRODUCT.snapCount(c),0)):trf('cartExpOne',built&&built.ok?built.units.length:PRODUCT.snapCount(PRODUCT.snap()));x.disabled=!CART.length&&!ok}}
async function exportCart(){if(!unlockedNow())return;let msg='';const keep=PRODUCT.snap();if(!keep.name)keep.name=PRODUCT.snapName(keep);const list=CART.length?CART:[keep];
 const st=document.getElementById('status'),x=gEl('cartexp');const files=[],cfgs=[];if(x)x.disabled=true;
 try{for(let i=0;i<list.length;i++){st.innerHTML='<b>'+tr('exporting')+' '+(i+1)+'/'+list.length+'</b>';await new Promise(r=>setTimeout(r,30));
   PRODUCT.applySnap(list[i]);const r=await PRODUCT.build(9,.02);if(!r.ok)throw new Error(list[i].name+': '+r.err);cfgs.push(r.units);
   const dir=(i+1)+'-'+list[i].name+'/',arr=arrange(r.parts,'print');
   files.push({name:dir+list[i].name+'.3mf',data:new Uint8Array(await threeMF(arr.map(p=>({...p,color:PRODUCT.color?PRODUCT.color(p):S[p.key]}))).arrayBuffer())});
   r.parts.forEach((p,k)=>files.push({name:dir+'stl/'+(k+1)+'-'+p.name+(p.qty>1?'_x'+p.qty:'')+'.stl',data:stlOf(p.pf?xf(p.tris,p.pf):p.tris)}))}
  PRODUCT.applySnap(keep);
  const c=await charge(cfgs);if(c){download(zip(files),CART.length?PRODUCT.file+'-Warenkorb.zip':PRODUCT.file+'-'+keep.name.normalize('NFD').replace(/[^\w\- ]/g,'').trim().replace(/ +/g,'-')+'.zip');if(CONFIG.requireCode)msg=[c.n?trf('charged',c.n):'',c.free?trf('chargedFree',c.free):''].filter(Boolean).join(' ')}}
 catch(e){st.textContent=e.message}
 finally{PRODUCT.applySnap(keep);buildUI();present(false);renderCart();if(msg)st.innerHTML+='<br><b>'+msg+'</b>'}}
