:root{--bg:#f6f3ee;--card:#fff;--ink:#23201c;--mut:#7a7368;--line:#e3ddd2;--acc:#c8553d;--acc2:#a8412c;--r:12px}
@media(prefers-color-scheme:dark){:root{--bg:#1c1a17;--card:#27241f;--ink:#f1ece4;--mut:#a39a8c;--line:#3a352e;--acc:#e0725a;--acc2:#f08a72}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;font-weight:650}
.lang button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer}
main{display:grid;grid-template-columns:1fr;gap:0}
.view{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 16px 0}
#gl{width:100%;height:38vh;min-height:230px;display:block;border-radius:var(--r);background:radial-gradient(circle at 50% 35%,#fff,#e8e2d6);touch-action:none;cursor:grab}
@media(prefers-color-scheme:dark){#gl{background:radial-gradient(circle at 50% 35%,#3a352d,#1f1c18)}}
#status{font-size:12px;color:var(--mut);padding:6px 2px;min-height:26px}
#status b{color:var(--acc)}
.panel{padding:8px 16px 120px;display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
.card h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0;font-weight:650}
label{display:grid;gap:4px;font-size:13px;color:var(--mut)}
label .row{display:flex;justify-content:space-between}
label output{color:var(--ink);font-variant-numeric:tabular-nums}
input[type=text],select{width:100%;padding:10px 12px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px}
input[type=range]{width:100%;accent-color:var(--acc)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;padding:9px 10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;font:inherit;cursor:pointer}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.colors input{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px}
.chk{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
.bar button{flex:1;padding:13px 10px;border-radius:10px;border:1px solid var(--acc);font:inherit;font-weight:600;cursor:pointer;background:var(--acc);color:#fff}
.bar button.sec{background:none;color:var(--acc)}
.bar button:disabled{opacity:.5}
#gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;place-items:center;padding:20px}
#gate div{max-width:380px;display:grid;gap:12px}
#gate button{padding:12px;border-radius:10px;border:0;background:var(--acc);color:#fff;font:inherit;font-weight:600}
#gmsg{color:var(--acc);min-height:1.2em;font-size:13px}
@media(min-width:900px){
 main{grid-template-columns:minmax(0,1.25fr) minmax(340px,.75fr);height:calc(100vh - 53px)}
 .view{position:static;padding:12px 8px 12px 16px;display:flex;flex-direction:column}
 #gl{height:auto;flex:1}
 .panel{overflow:auto;padding-bottom:90px}
}

:root{--bg:#f5f3ef;--card:#fffdf9;--line:#e4e0d7;--acc:#657a64;--acc2:#4f6350;--mut:#74776e}
@media(prefers-color-scheme:dark){:root{--bg:#1d1f1b;--card:#272a24;--line:#383c33;--acc:#86a084;--acc2:#a3bba1;--mut:#a2a79a}}
header{background:var(--card)}
.brand{display:flex;gap:11px;align-items:center}.mark{width:36px;height:36px;border-radius:11px;background:var(--acc);display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px}
header h1 span{font-weight:400;color:var(--mut)}header p{margin:1px 0 0;color:var(--mut);font-size:12px}
.stage{position:relative;height:38vh;min-height:240px}.stage #gl{height:100%;min-height:0}
.vt{position:absolute;right:10px;top:10px;display:flex;gap:6px}.vt button{padding:6px 10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font:inherit;font-size:12px;cursor:pointer}.vt button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:2px 0 8px}.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}.stat span{display:block;font-size:11px;color:var(--mut)}.stat strong{font-size:16px;font-variant-numeric:tabular-nums}
.card p{margin:0;font-size:13px;color:var(--mut)}.btn{padding:11px;border-radius:10px;border:1px solid var(--acc);background:none;color:var(--acc);font:inherit;font-weight:600;cursor:pointer}
.panel[data-mode=single] .addrow,.panel[data-mode=single] .mg,.panel[data-mode=single] .mh button,.panel[data-mode=single] .pfill{display:none}.panel[data-mode=plan] .tsel{display:none}
.mrow{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px}.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.mh button{border:0;background:none;color:var(--mut);cursor:pointer;font-size:16px}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.mo{display:flex;gap:10px;align-items:end;margin-top:6px}.mrow label{font-size:11px;color:var(--mut)}.mrow input[type=number],.mrow select{width:100%;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.addrow .btn{flex:1;padding:8px}#plmsgs{margin:0;padding-left:18px;font-size:13px}#plmsgs li.e{color:#b3402a;font-weight:600}#plmsgs li.i{color:var(--mut)}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
@media(min-width:900px){.stage{height:auto;flex:1;min-height:320px}}
.crow{display:flex;gap:6px;margin:6px 0}.crow input{flex:1;min-width:0}.crow button{width:36px}.gx{margin-left:8px;background:none!important;color:inherit!important;border:1px solid currentColor!important;width:auto}#creditinfo{font-size:13px;margin:8px 0}
</style>

<script>
'use strict';
/* Einstellungen kommen aus config.js (window.MN_CONFIG); fehlt die Datei (z. B. offline), gilt der Testmodus */
const CONFIG=Object.assign({requireCode:false,api:''},window.MN_CONFIG||{});
const area=r=>{let a=0;for(let i=0,n=r.length;i<n;i++){const p=r[i],q=r[(i+1)%n];a+=p[0]*q[1]-q[0]*p[1]}return a/2};

const CORN=[[0,0],[1,0],[1,1],[0,1]],EDG=[[.5,0],[1,.5],[.5,1],[0,.5]],CUT=[[0,3],[0,1],[1,2],[2,3]];

function marching(F,w,h,res){

function clip(P,out){

function triangulate(rings){

 const ct=`<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="model" ContentType="application/vnd.ms-package.3dmanufacturing-3dmodel+xml"/></Types>`;
 const rels=`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Target="/3D/3dmodel.model" Id="rel0" Type="http://schemas.microsoft.com/3dmanufacturing/2013/01/3dmodel"/></Relationships>`;
 const e=new TextEncoder();return zip([{name:'[Content_Types].xml',data:e.encode(ct)},{name:'_rels/.rels',data:e.encode(rels)},{name:'3D/3dmodel.model',data:e.encode(model)}])}
function presentPlan(reframe){const sol=built.sol,arr0=sol.ok?arrange(built.parts,S.view):[],arr=arr0.filter(p=>!(S.hide&&S.hide[p.key]));
 setMeshes(arr.map(p=>({...p,tris:clean(p.tris)})));if(reframe&&arr.length){frame(arr)}draw();
 document.querySelectorAll('.vt button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));
 const msgs=sol.msgs.slice();if(sol.ok)msgs.push(['okFit',sol.items.length,built.info.keys]);
 document.getElementById('plmsgs').innerHTML=msgs.map(m=>`<li class="${m[0][0]}">${trf(...m)}</li>`).join('');
 const i=built.info,mass=sol.ok?built.parts.reduce((s,p)=>s+Math.abs(volume(p.tris))*(p.qty||1),0)/1000*1.24:0,span=sol.ok?arrange(built.parts,'print').span:[0,0];
 document.getElementById('stats').innerHTML=sol.ok?[[tr('sVol'),i.vol.toFixed(1)+' L'],[tr('sMods'),sol.items.length],[tr('sMat'),'≈ '+Math.round(mass)+' g'],[tr('sParts'),built.parts.reduce((s,p)=>s+(p.qty||1),0)]].map(a=>`<div class="stat"><span>${a[0]}</span><strong>${a[1]}</strong></div>`).join(''):'';
 let wmsg='';if(sol.ok){let big=false,fa=0;built.parts.forEach(p=>{const q=bbox(p.tris);const w=q.b[0]-q.a[0],d=q.b[1]-q.a[1];if(Math.min(w,d)>250||Math.max(w,d)>256&&Math.min(w,d)>256||q.b[2]>256)big=true;fa+=(w+8)*(d+8)*(p.qty||1)});
  if(big)wmsg=tr('warnBed');else if(fa>.75*246*246)wmsg=trf('iPlates',Math.ceil(fa/(.75*246*246)))}
 status.innerHTML=`${PL.W} × ${PL.D} × ${PL.H} mm`+(wmsg?`<br><b>${wmsg}</b>`:'');
 document.getElementById('b3mf').disabled=document.getElementById('bstl').disabled=!sol.ok}
function numIn(m,k,mn,mx){const i=document.createElement('input');i.type='number';i.min=mn;i.max=mx;i.step=5;i.value=m[k];i.onchange=()=>{m[k]=Math.max(mn,Math.min(mx,+i.value||mn));i.value=m[k];changed()};return i}
function mkSel(m,key,lk,vals,lab){const l=document.createElement('label'),s=document.createElement('span'),sel=document.createElement('select');s.textContent=tr(lk);vals.forEach(v=>{const op=document.createElement('option');op.value=v;op.textContent=lab?tr(lab+v):v;sel.append(op)});sel.value=m[key]??vals[0];sel.onchange=()=>{m[key]=typeof vals[0]==='number'?+sel.value:sel.value;changed()};l.append(s,sel);return l}
function renderMods(){const list=document.getElementById('modlist');list.innerHTML='';const single=S.mode==='single',ms=single?[PL.one]:PL.mods;
 ms.forEach((m,ix)=>{const row=document.createElement('div');row.className='mrow';
  const h=document.createElement('div');h.className='mh';const b=document.createElement('b');b.textContent=tr('t_'+m.type)+(single?'':' '+(ix+1));const x=document.createElement('button');x.textContent='✕';x.title=tr('del');x.onclick=()=>{PL.mods.splice(ix,1);renderMods();changed()};h.append(b,x);row.append(h);
  if(single){const o=document.createElement('div');o.className='mo';o.append(mkSel(m,'type','typeSel',['box','drawer'],'t_'));const sl=o.querySelector('select');sl.onchange=()=>{m.type=sl.value;renderMods();changed()};row.append(o)}
  const g=document.createElement('div');g.className='mg';
  [['w','mW',20,PL.W],['d','mD',20,PL.D],['h','mH',15,PL.H]].forEach(([k,lk,mn,mx])=>{const l=document.createElement('label'),sp=document.createElement('span');sp.textContent=tr(lk);l.append(sp,numIn(m,k,mn,Math.max(mx,mn)));g.append(l)});
  row.append(g);
  const o=document.createElement('div');o.className='mo';
  if(m.type==='drawer')o.append(mkSel(m,'nd','nDr',[1,2,3,4]));
  else{o.append(mkSel(m,'cols','cols',[1,2,3,4]),mkSel(m,'rows','rows',[1,2,3,4]),mkSel(m,'div','divN',[0,1,2,3]),mkSel(m,'lid','lidSel',['none','plug','slide','hinge'],'lid_'));
   const l3=document.createElement('label');l3.className='chk';const c3=document.createElement('input');c3.type='checkbox';c3.checked=!!m.tray;c3.onchange=()=>{m.tray=c3.checked;changed()};const s3=document.createElement('span');s3.textContent=tr('tray');l3.append(c3,s3);o.append(l3);
   const l4=document.createElement('label'),s4=document.createElement('span'),i4=document.createElement('input');s4.textContent=tr('label');i4.type='text';i4.maxLength=40;i4.value=m.label||'';i4.oninput=()=>{m.label=i4.value;changed()};l4.append(s4,i4);o.append(l4)}
  row.append(o);list.append(row)})}
function buildPlanUI(){let c=card('space');c._t=PL;
 rng(c,'W','width',50,600,5,'mm');rng(c,'D','depth',50,400,5,'mm');rng(c,'H','height',25,250,5,'mm');chk(c,'fill','fill');c.lastChild.classList.add('pfill');
 c=card('plmods');const add=document.createElement('div');add.className='addrow';
 ['box','tall','drawer'].forEach(ty=>{const b=document.createElement('button');b.className='btn';b.dataset.k='add_'+ty;b.onclick=()=>{const d=MODDEF[ty];PL.mods.push({type:ty,w:d.w,d:d.d,h:Math.min(d.h,PL.H),div:0,lid:'none'});renderMods();changed()};add.append(b)});
 const list=document.createElement('div');list.id='modlist';c.append(add,list);
 c=card('plset');seg(c,'wall','wall',[[1.6,'1.6 mm'],[2,'2.0 mm'],[2.4,'2.4 mm'],[3,'3.0 mm']]);rng(c,'r','corners',0,12,1,'mm');chk(c,'stack','stack');chk(c,'sharpSeam','sharpSeam');chk(c,'filler','filler');seg(c,'tex','tex',[['none','tx_none'],['ribs','tx_ribs'],['waves','tx_waves'],['facets','tx_facets']]);
 c=card('plmsg');const ul=document.createElement('ul');ul.id='plmsgs';c.append(ul);renderMods()}
/* ================= Freischaltung (Server-Pruefung) + Warenkorb ================= */
const gEl=id=>document.getElementById(id);
let SES=null;try{SES=JSON.parse(localStorage.getItem('mn-ses')||'null')}catch(e){}
const saveSes=()=>{try{SES?localStorage.setItem('mn-ses',JSON.stringify(SES)):localStorage.removeItem('mn-ses')}catch(e){}};
const apiCall=async(p,b)=>{try{const r=await fetch(CONFIG.api.replace(/\/$/,'')+'/'+p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});return{ok:r.ok,j:await r.json().catch(()=>({}))}}catch(e){return{ok:false,j:{error:'net'}}}};
function creditInfo(){const e=gEl('creditinfo');if(!e)return;e.textContent=!CONFIG.requireCode?tr('demoMode'):(SES&&SES.exp>Date.now()?trf('creditLeft',SES.left):tr('notUnlocked'))}
function gate(msg){gEl('gate').style.display='grid';gEl('gmsg').textContent=msg||''}
async function redeem(code){const r=await apiCall('redeem',{code});if(!r.ok)return tr(r.j.error==='rate'?'gateRate':r.j.error==='net'?'gateNet':'gateBad');SES={token:r.j.token,left:r.j.left,exp:r.j.exp};saveSes();creditInfo();return''}
function unlockedNow(){if(!CONFIG.requireCode)return true;if(!CONFIG.api){gate(tr('gateCfg'));return false}if(!SES||SES.exp<Date.now()){gate();return false}return true}
async function charge(n){if(!CONFIG.requireCode)return true;const r=await apiCall('consume',{token:SES.token,n});
 if(r.ok){SES.left=r.j.left;saveSes();creditInfo();return true}
 if(r.j.error==='credits'){SES.left=r.j.left||0;saveSes();creditInfo();gate(tr('gateEmpty'))}else if(r.j.error==='net')gate(tr('gateNet'));else{SES=null;saveSes();creditInfo();gate(tr('gateBad'))}return false}
gEl('gok').onclick=async()=>{const m=await redeem(gEl('gcode').value);if(m)gEl('gmsg').textContent=m;else gEl('gate').style.display='none'};
gEl('gx').onclick=()=>{gEl('gate').style.display='none'};
/* Warenkorb */
let CART=[];try{CART=JSON.parse(localStorage.getItem('mn-cart')||'[]')}catch(e){}
const saveCart=()=>{try{localStorage.setItem('mn-cart',JSON.stringify(CART))}catch(e){}};
const SKEYS=['wall','r','stack','conn','sharpSeam','filler','tex','fit','mode','cBox','cLid','cTray','cKey'];
const snap=()=>{const o={};SKEYS.forEach(k=>o[k]=S[k]);return{S:o,PL:JSON.parse(JSON.stringify(PL))}};
function applySnap(s){Object.assign(S,s.S);for(const k in PL)delete PL[k];Object.assign(PL,JSON.parse(JSON.stringify(s.PL)))}
const snapName=s=>(s.S.mode==='plan'?'Plan':'Box')+' '+s.PL.W+'x'+s.PL.D+'x'+s.PL.H;
function addCart(){const s=snap();s.name=snapName(s);CART.push(s);saveCart();renderCart()}
function renderCart(){const e=gEl('cartlist');if(!e)return;e.innerHTML='';
 if(!CART.length){e.textContent=tr('cartEmpty');return}
 CART.forEach((it,i)=>{const r=document.createElement('div');r.className='crow';const n=document.createElement('input');n.value=it.name;n.onchange=()=>{it.name=n.value.replace(/[^\w\- ]+/g,'').trim()||'Konfig';saveCart()};
  const l=document.createElement('button');l.textContent='↺';l.title=tr('cartLoad');l.onclick=()=>{applySnap(it);buildUI();changed()};
  const d=document.createElement('button');d.textContent='×';d.onclick=()=>{CART.splice(i,1);saveCart();renderCart()};r.append(n,l,d);e.append(r)})}
async function exportCart(){if(!CART.length||!unlockedNow())return;if(CONFIG.requireCode&&SES.left<CART.length){gate(tr('gateEmpty'));return}const st=document.getElementById('status'),keep=snap();const files=[];
 try{for(let i=0;i<CART.length;i++){st.innerHTML='<b>'+tr('exporting')+' '+(i+1)+'/'+CART.length+'</b>';await new Promise(r=>setTimeout(r,30));
   applySnap(CART[i]);const r=await buildPlan(9,.02);if(!r.sol.ok)throw new Error(CART[i].name+': '+r.sol.msgs.map(x=>x.join(' ')).join('; '));
   const dir=(i+1)+'-'+CART[i].name+'/',arr=arrange(r.parts,'print');
   files.push({name:dir+CART[i].name+'.3mf',data:new Uint8Array(await threeMF(arr.map(p=>({...p,color:S[p.key]}))).arrayBuffer())});
   r.parts.forEach((p,k)=>files.push({name:dir+'stl/'+(k+1)+'-'+p.name+(p.qty>1?'_x'+p.qty:'')+'.stl',data:stlOf(p.pf?xf(p.tris,p.pf):p.tris)}))}
  applySnap(keep);
  if(await charge(CART.length))download(zip(files),'ModuNest-Warenkorb.zip')}
 catch(e){st.textContent=e.message}
 finally{applySnap(keep);buildUI();present(false)}}
